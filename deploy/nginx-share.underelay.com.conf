map $http_upgrade $sharesub_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name share.underelay.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name share.underelay.com;

    ssl_certificate /etc/ssl/cloudflare/www.underelay.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/www.underelay.com.key;

    client_max_body_size 256m;

    location ~ ^/(v1/alpha/search|alpha/search|backend-api/codex/alpha/search)$ {
        client_max_body_size 32m;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sharesub_connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
