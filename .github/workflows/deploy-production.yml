name: Deploy production

on:
  workflow_dispatch:
    inputs:
      allow_migrations:
        description: Allow database migrations in this release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sharesub_test
          POSTGRES_PASSWORD: sharesub_test
          POSTGRES_DB: sharesub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sharesub_test -d sharesub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHARESUB_TEST_DATABASE_URL: postgres://sharesub_test:sharesub_test@127.0.0.1:5432/sharesub_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify release tag
        run: ./scripts/verify-version.sh --release

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Configure production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy immutable images
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          DEPLOY_DIR: ${{ secrets.PRODUCTION_DEPLOY_DIR }}
          ALLOW_MIGRATIONS: ${{ inputs.allow_migrations }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_DIR"
          if [ "$ALLOW_MIGRATIONS" = "true" ]; then
            migration_flag=1
          else
            migration_flag=0
          fi
          SHARESUB_DEPLOY_HOST="$DEPLOY_USER@$DEPLOY_HOST" \
          SHARESUB_DEPLOY_DIR="$DEPLOY_DIR" \
          SHARESUB_DEPLOY_VIA_GITHUB_ACTIONS=1 \
          SHARESUB_DEPLOY_ALLOW_MIGRATIONS="$migration_flag" \
          ./scripts/deploy.sh deploy
