name: CI and images

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sharesub_test
          POSTGRES_PASSWORD: sharesub_test
          POSTGRES_DB: sharesub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sharesub_test -d sharesub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHARESUB_TEST_DATABASE_URL: postgres://sharesub_test:sharesub_test@127.0.0.1:5432/sharesub_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Verify version metadata
        run: ../scripts/verify-version.sh
      - name: Test version validation
        run: ../scripts/verify-version-test.sh
      - name: Test production deployment guard
        run: ../scripts/deploy-test.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check repository structure
        working-directory: ${{ github.workspace }}
        run: ./scripts/check-quality-structure.sh
      - name: Check Go formatting
        run: test -z "$(gofmt -l ./cmd ./internal ./migrations)"
      - run: go vet ./...
      - run: go test ./...

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Verify version metadata
        run: ../scripts/verify-version.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:run
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm bundle:check

  images:
    name: Publish ${{ matrix.name }} image
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: API
            dockerfile: backend/Dockerfile
            image: sharesub-api
          - name: Web
            dockerfile: frontend/Dockerfile
            image: sharesub-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read release version
        id: version
        run: echo "value=$(./scripts/verify-version.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            SHARESUB_VERSION=${{ steps.version.outputs.value }}
            SHARESUB_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:main
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
