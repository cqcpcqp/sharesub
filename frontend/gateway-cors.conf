if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin "https://cooksleep.github.io" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, OpenAI-Beta, X-Request-Id" always;
    add_header Access-Control-Max-Age 86400 always;
    return 204;
}

add_header Access-Control-Allow-Origin "https://cooksleep.github.io" always;
add_header Vary "Origin" always;
