map $http_upgrade $sharesub_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;

    client_max_body_size 256m;
    proxy_connect_timeout 60s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        include /etc/nginx/gateway-cors.conf;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sharesub_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /backend-api/ {
        include /etc/nginx/gateway-cors.conf;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sharesub_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /responses {
        include /etc/nginx/gateway-cors.conf;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sharesub_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /responses/ {
        include /etc/nginx/gateway-cors.conf;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sharesub_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /alpha/search {
        client_max_body_size 32m;
        include /etc/nginx/gateway-cors.conf;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /v1/alpha/search {
        client_max_body_size 32m;
        include /etc/nginx/gateway-cors.conf;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /backend-api/codex/alpha/search {
        client_max_body_size 32m;
        include /etc/nginx/gateway-cors.conf;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /images/ {
        include /etc/nginx/gateway-cors.conf;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /models {
        include /etc/nginx/gateway-cors.conf;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
