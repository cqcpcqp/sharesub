<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>验证你的 ShareSub 邮箱</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f6fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background-color:#f3f6fb;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;border:1px solid #dfe6f1;border-radius:16px;">
          <tr>
            <td style="padding:32px 40px 16px;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td valign="middle" style="width:40px;height:40px;border-radius:10px;background-color:#2563eb;color:#ffffff;font-size:18px;font-weight:700;text-align:center;line-height:40px;">S</td>
                  <td valign="middle" style="padding-left:12px;font-size:21px;font-weight:700;letter-spacing:-0.2px;color:#172033;">ShareSub</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 40px 40px;">
              <h1 style="margin:0 0 18px;font-size:26px;line-height:1.35;font-weight:700;color:#172033;">验证你的邮箱</h1>
              <p style="margin:0 0 16px;font-size:16px;line-height:1.75;color:#475569;">你正在使用此邮箱注册 ShareSub。请点击下面的按钮完成邮箱验证，验证成功后即可登录并使用 ShareSub。</p>
              <p style="margin:0 0 28px;font-size:16px;line-height:1.75;color:#475569;">此验证链接将在 1 小时后失效，并且只能使用一次。</p>
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:0 0 28px;">
                <tr>
                  <td align="center" bgcolor="#2563eb" style="border-radius:10px;">
                    <a href="https://share.underelay.com/verify-email#token={{token}}" target="_blank" style="display:inline-block;padding:14px 26px;color:#ffffff;font-size:16px;font-weight:700;line-height:1.2;text-decoration:none;border-radius:10px;">验证邮箱</a>
                  </td>
                </tr>
              </table>
              <div style="margin:0 0 24px;padding:16px 18px;background-color:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;">
                <p style="margin:0 0 8px;font-size:13px;line-height:1.6;color:#64748b;">如果按钮无法打开，请复制下面的完整链接到浏览器：</p>
                <p style="margin:0;font-size:13px;line-height:1.7;word-break:break-all;">
                  <a href="https://share.underelay.com/verify-email#token={{token}}" target="_blank" style="color:#2563eb;text-decoration:underline;">https://share.underelay.com/verify-email#token={{token}}</a>
                </p>
              </div>
              <p style="margin:0;font-size:14px;line-height:1.7;color:#64748b;">如果不是你本人发起的注册，请忽略此邮件。你的邮箱不会因此完成注册。</p>
            </td>
          </tr>
          <tr>
            <td style="padding:22px 40px;border-top:1px solid #e7edf5;background-color:#fbfcfe;border-radius:0 0 16px 16px;">
              <p style="margin:0 0 6px;font-size:12px;line-height:1.6;color:#7c8799;">此邮件由 ShareSub 系统自动发送，请勿回复。</p>
              <p style="margin:0;font-size:12px;line-height:1.6;color:#7c8799;">ShareSub 是独立产品，与 OpenAI 无隶属、授权或代理关系。</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
